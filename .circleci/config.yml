version: 2.1

jobs:
  build:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable

    resource_class: medium
    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Install Java 25 (Temurin)
          command: |
            sudo apt update
            sudo apt install -y openjdk-25-jdk

      - run:
          name: Flutter Doctor
          command: flutter doctor -v

      - run:
          name: Clean and Install Dependencies
          command: |
            flutter clean
            flutter pub get

      - run:
          name: Extract Version
          command: |
            VERSION=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | xargs | cut -d'+' -f1)
            echo "export VERSION=$VERSION" >> $BASH_ENV

      - run:
          name: Build APK
          command: flutter build apk --release --verbose

      - run:
          name: Rename APK
          command: |
            mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Wallora-${VERSION}.apk

      - run:
          name: Install GitHub CLI
          command: |
            sudo apt update
            sudo apt install -y gh

      - run:
          name: Create GitHub Release
          command: |
            gh auth login --with-token <<< "$GH_PAT"
            gh release create v${VERSION} \
            build/app/outputs/flutter-apk/Wallora-${VERSION}.apk \
            --title "v${VERSION}" \
            --notes "Auto build from CircleCI"

workflows:
  build_release:
    jobs:
      - build