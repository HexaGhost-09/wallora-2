name: wallora
description: "Wallpapers App"
publish_to: 'none'

version: 1.2.7+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rename: ^3.1.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  async_wallpaper: ^2.1.0
  url_launcher: 6.3.0
  package_info_plus: 8.1.0
  fluttertoast: 8.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: assets/icon/icon.png
