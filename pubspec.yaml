name: wallora
description: "Wallpapers App"
publish_to: 'none'

version: 1.5.6+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rename: ^3.1.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  async_wallpaper:
    path: packages/async_wallpaper
  url_launcher: ^6.3.2
  package_info_plus: ^8.0.0
  fluttertoast: 8.2.14
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  iconsax: ^0.0.8
  blurhash: ^1.2.0
  postgres: ^3.5.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png
  linux:
    generate: true
    image_path: assets/icon/icon.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0F172A"
    theme_color: "#6366F1"
