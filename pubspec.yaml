name: wallora
description: "Wallpapers App"
publish_to: 'none'

version: 1.3.8+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rename: ^3.1.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  async_wallpaper: ^2.1.0
  url_launcher: 6.3.0
  package_info_plus: 8.1.0
  fluttertoast: 8.2.14
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.9.0+3
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.2
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  iconsax: ^0.0.8
  blurhash: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: assets/icon/icon.png
