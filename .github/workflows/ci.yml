name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Resolve app dependencies
        run: flutter pub get
      - name: Resolve wallpaper example dependencies
        working-directory: packages/async_wallpaper/example
        run: flutter pub get
      - name: Analyze workspace
        run: flutter analyze --no-fatal-infos
      - name: Test wallpaper plugin
        working-directory: packages/async_wallpaper
        run: flutter test
      - name: Test wallpaper example
        working-directory: packages/async_wallpaper/example
        run: flutter test
