name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | xargs | cut -d'+' -f1)

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Pushed tag $GITHUB_REF_NAME does not match pubspec version v${VERSION}."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            TRIGGER_VERSION="$(tr -d '[:space:]' < .github/release-trigger)"
            if [[ "$TRIGGER_VERSION" != "v${VERSION}" ]]; then
              echo "Release trigger requests $TRIGGER_VERSION but pubspec.yaml is v${VERSION}."
              exit 1
            fi
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build_android:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path is not configured."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Could not locate Android sdkmanager."
            exit 1
          fi

          # Accept SDK licences before installing the API platform. Temporarily
          # disable pipefail because 'yes' exits with SIGPIPE after sdkmanager
          # has consumed the answers; sdkmanager's exit code remains authoritative.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37"
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    needs: get_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build Installer (Inno Setup)
        run: |
          iscc /DAppVersion=${{ needs.get_version.outputs.version }} windows/installer.iss
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Wallora-v*-setup.exe
            build/windows/x64/runner/Release

  build_linux:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev
      - run: flutter build linux --release
      - name: Create Linux Bundle
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/Wallora-linux-v${VERSION}.tar.gz" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Wallora-linux-v*.tar.gz

  build_macos:
    needs: get_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd build/macos/Build/Products/Release
          hdiutil create -format UDZO -srcfolder *.app "Wallora-v${VERSION}.dmg"
          zip -r "Wallora-macos-v${VERSION}.zip" *.app
          mv "Wallora-v${VERSION}.dmg" "$GITHUB_WORKSPACE/"
          mv "Wallora-macos-v${VERSION}.zip" "$GITHUB_WORKSPACE/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Wallora-v*.dmg
            Wallora-macos-v*.zip

  build_ios:
    needs: get_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/Wallora-v${VERSION}.ipa" Payload
          zip -j "$GITHUB_WORKSPACE/ios-release.zip" "$GITHUB_WORKSPACE/Wallora-v${VERSION}.ipa"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            Wallora-v*.ipa
            ios-release.zip

  release:
    needs: [get_version, build_android, build_windows, build_linux, build_macos, build_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package builds
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cp artifacts/android-release/app-release.apk "Wallora-v${VERSION}.apk"
          cp artifacts/ios-release/Wallora-v${VERSION}.ipa "Wallora-v${VERSION}.ipa"
          zip -j "ios-release.zip" "Wallora-v${VERSION}.ipa"
          cp artifacts/windows-release/Wallora-v*-setup.exe "Wallora-v${VERSION}-setup.exe"
          cd artifacts/windows-release && zip -r "../../Wallora-windows-v${VERSION}.zip" . -x "Wallora-v*-setup.exe" && cd ../..
          cp "Wallora-windows-v${VERSION}.zip" "windows-release.zip"
          cp artifacts/linux-release/Wallora-linux-v${VERSION}.tar.gz .
          cp "Wallora-linux-v${VERSION}.tar.gz" "linux-release.tar.gz"
          cp artifacts/macos-release/Wallora-v${VERSION}.dmg .
          cp artifacts/macos-release/Wallora-macos-v${VERSION}.zip .
          cp "Wallora-macos-v${VERSION}.zip" "macos-release.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: Release v${{ needs.get_version.outputs.version }}
          files: |
            *.apk
            *.ipa
            *.dmg
            *.exe
            *.zip
            *.tar.gz
