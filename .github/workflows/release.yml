name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | xargs | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  build_android:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    needs: get_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build Installer (Inno Setup)
        run: |
          iscc /DAppVersion=${{ needs.get_version.outputs.version }} windows/installer.iss
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Wallora-v*-setup.exe
            build/windows/x64/runner/Release

  build_linux:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter build linux --release
      - name: Create Linux Bundle
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/Wallora-linux-v${VERSION}.tar.gz" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: Wallora-linux-v*.tar.gz

  build_macos:
    needs: get_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd build/macos/Build/Products/Release
          # Create DMG (use wildcard for .app)
          hdiutil create -format UDZO -srcfolder *.app "Wallora-v${VERSION}.dmg"
          # Create Zip (use wildcard for .app)
          zip -r "Wallora-macos-v${VERSION}.zip" *.app
          mv "Wallora-v${VERSION}.dmg" "$GITHUB_WORKSPACE/"
          mv "Wallora-macos-v${VERSION}.zip" "$GITHUB_WORKSPACE/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            Wallora-v*.dmg
            Wallora-macos-v*.zip

  build_ios:
    needs: get_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "$GITHUB_WORKSPACE/Wallora-v${VERSION}.ipa" Payload
          # Also the zip requested
          zip -j "$GITHUB_WORKSPACE/ios-release.zip" "$GITHUB_WORKSPACE/Wallora-v${VERSION}.ipa"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            Wallora-v*.ipa
            ios-release.zip

  release:
    needs: [get_version, build_android, build_windows, build_linux, build_macos, build_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package builds
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          
          # Android
          cp artifacts/android-release/app-release.apk "Wallora-v${VERSION}.apk"
          
          # iOS
          cp artifacts/ios-release/Wallora-v${VERSION}.ipa "Wallora-v${VERSION}.ipa"
          zip -j "ios-release.zip" "Wallora-v${VERSION}.ipa"
          
          # Windows
          # Get the EXE installer
          cp artifacts/windows-release/*.exe "Wallora-v${VERSION}-setup.exe"
          # Also package the raw exe folder for portable use
          cd artifacts/windows-release && zip -r "../../windows-release.zip" . -x "*.exe" && cd ../..
          cp "windows-release.zip" "Wallora-windows-v${VERSION}.zip"
          
          # Linux
          cp artifacts/linux-release/Wallora-linux-v${VERSION}.tar.gz .
          cp "Wallora-linux-v${VERSION}.tar.gz" "linux-release.tar.gz"
          
          # macOS
          cp artifacts/macos-release/Wallora-v${VERSION}.dmg .
          cp artifacts/macos-release/Wallora-macos-v${VERSION}.zip .
          cp "Wallora-macos-v${VERSION}.zip" "macos-release.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: Release v${{ needs.get_version.outputs.version }}
          files: |
            *.apk
            *.ipa
            *.dmg
            *.exe
            *.zip
            *.tar.gz
