name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.get_version.outputs.version_tag }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "version_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "version_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "version_tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

  build_linux:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter build linux --release
      - name: Archive Release
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../linux-release.zip .
          cd ../../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-release.zip

  build_android:
    needs: get_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Wallora-${{ needs.get_version.outputs.version_tag }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Wallora-${{ needs.get_version.outputs.version_tag }}.apk

  build_windows:
    needs: get_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive Release
        run: |
          if (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path build\windows\runner\Release\* -DestinationPath windows-release.zip
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build_macos_ios:
    needs: get_version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      # iOS build steps
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Archive unsigned iOS app
        run: |
          cd build/ios/iphoneos/
          zip -r ../../../ios-release.zip Runner.app
          cd ../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios-release.zip
      # macOS build steps
      - run: flutter build macos --release
      - name: Archive macOS Release
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../macos-release.zip .
          cd ../../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: macos-release.zip

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [get_version, build_linux, build_android, build_windows, build_macos_ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          tag_name: ${{ needs.get_version.outputs.version_tag }}
          name: Release ${{ needs.get_version.outputs.version_tag }}
          body: "New release ${{ needs.get_version.outputs.version_tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
