name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter build linux --release
      - name: Archive Release
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../linux-release.zip .
          cd ../../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: linux-release.zip

  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk Wallora-v${{ github.event.inputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Wallora-v${{ github.event.inputs.version }}.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive Release
        run: |
          Compress-Archive -Path build\windows\runner\Release\* -DestinationPath windows-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build_macos_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      # iOS build steps
      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/exportOptions.plist
      - name: Archive IPA
        run: |
          mkdir -p build/ios/ipa
          mv build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/
          cd build/ios/ipa
          zip -r ../../../ios-release.zip .
          cd ../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios-release.zip
      # macOS build steps
      - run: flutter build macos --release
      - name: Archive macOS Release
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../macos-release.zip .
          cd ../../../../../
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: macos-release.zip

  release:
    runs-on: ubuntu-latest
    needs: [build_linux, build_android, build_windows, build_macos_ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: "New release v${{ github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
