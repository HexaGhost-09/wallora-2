name: Generate Screenshots

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies and enable web
        run: |
          flutter pub get
          flutter config --enable-web

      - name: Run integration tests on Chrome
        run: flutter test -d chrome integration_test/app_test.dart
