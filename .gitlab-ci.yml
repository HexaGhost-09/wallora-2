stages:
  - build
  - release

variables:
  # Define variables for reuse
  APK_PATH: "build/app/outputs/flutter-apk"

build_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - flutter pub get
  script:
    - # Extract version from pubspec.yaml (e.g., 1.5.6)
    - VERSION=$(grep '^version:' pubspec.yaml | cut -d':' -f2 | sed 's/ //g' | cut -d'+' -f1)
    - echo "APP_VERSION=$VERSION" >> build.env
    - echo "Building Wallora version $VERSION"
    - flutter build apk --release --verbose
    - # Rename APK as per GitHub Action requirements
    - mv $APK_PATH/app-release.apk $APK_PATH/Wallora-$VERSION.apk
  artifacts:
    paths:
      - $APK_PATH/Wallora-*.apk
    reports:
      # Pass the VERSION variable to the release stage
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_apk
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating GitLab Release for v$APP_VERSION"
  release:
    name: "v$APP_VERSION"
    tag_name: "v$APP_VERSION"
    description: "Automated release of Wallora v$APP_VERSION"
    assets:
      links:
        - name: "Wallora-$APP_VERSION.apk"
          # Note: This URL points to the artifact from the 'build_apk' job. 
          # It uses the project's permanent job artifact endpoint.
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/$APK_PATH/Wallora-${APP_VERSION}.apk?job=build_apk"
