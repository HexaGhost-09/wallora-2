stages:
  - build
  - release

variables:
  FLUTTER_VERSION: "stable"
  APP_NAME: "Wallora"

.flutter_setup: &flutter_setup
  before_script:
    - flutter pub get

# -----------------------------------------------------------------------------
# Android Build
# -----------------------------------------------------------------------------
build_android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  <<: *flutter_setup
  script:
    - VERSION=$(grep "^version:" pubspec.yaml | cut -d":" -f2 | sed "s/ //g" | cut -d"+" -f1)
    - echo "APP_VERSION=$VERSION" >> build.env
    - flutter build apk --release
    - mv build/app/outputs/flutter-apk/app-release.apk Wallora-$VERSION.apk
  artifacts:
    paths:
      - Wallora-*.apk
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# Linux Build
# -----------------------------------------------------------------------------
build_linux:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - apt-get update -y
    - apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev
    - flutter pub get
  script:
    - VERSION=$(grep "^version:" pubspec.yaml | cut -d":" -f2 | sed "s/ //g" | cut -d"+" -f1)
    - flutter build linux --release
    - cd build/linux/x64/release/bundle
    - tar -czf "../../../../Wallora-linux-v${VERSION}.tar.gz" .
  artifacts:
    paths:
      - Wallora-linux-v*.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------------------------
# Windows Build (Requires a GitLab Runner with shell/windows executor)
# -----------------------------------------------------------------------------
build_windows:
  stage: build
  tags:
    - windows
  script:
    - $VERSION = (Select-String -Path pubspec.yaml -Pattern "^version:").Line.Split(":")[1].Trim().Split("+")[0]
    - flutter pub get
    - flutter build windows --release
    - Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Wallora-windows-v$VERSION.zip"
  artifacts:
    paths:
      - Wallora-windows-v*.zip
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # Often manual because tagged Windows runners are less common

# -----------------------------------------------------------------------------
# macOS/iOS Build (Requires a macOS GitLab Runner)
# -----------------------------------------------------------------------------
build_macos_ios:
  stage: build
  tags:
    - macos
  script:
    - VERSION=$(grep "^version:" pubspec.yaml | cut -d":" -f2 | sed "s/ //g" | cut -d"+" -f1)
    # macOS
    - flutter pub get
    - flutter build macos --release
    - cd build/macos/Build/Products/Release
    - zip -r "../../../../../Wallora-macos-v${VERSION}.zip" *.app
    - cd ../../../../..
    # iOS
    - flutter build ios --release --no-codesign
    - mkdir -p Payload
    - cp -r build/ios/iphoneos/Runner.app Payload/
    - zip -r "Wallora-v${VERSION}.ipa" Payload
  artifacts:
    paths:
      - Wallora-macos-v*.zip
      - Wallora-v*.ipa
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual # Often manual unless you have dedicated macOS runners

# -----------------------------------------------------------------------------
# Release Stage
# -----------------------------------------------------------------------------
create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_android
      artifacts: true
    - job: build_linux
      artifacts: true
    - job: build_windows
      artifacts: true
      optional: true
    - job: build_macos_ios
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "Creating GitLab Release for v$APP_VERSION"
  release:
    name: "v$APP_VERSION"
    tag_name: "v$APP_VERSION"
    description: "Automated release of Wallora v$APP_VERSION"
    assets:
      links:
        - name: "Android APK"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/Wallora-${APP_VERSION}.apk?job=build_android"
        - name: "Linux Bundle"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/main/raw/Wallora-linux-v${APP_VERSION}.tar.gz?job=build_linux"
